name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -t gcr.io/$GCP_PROJECT_ID/handwritten-digit-recognizer-app:$GITHUB_SHA .

      - name: Push Docker image
        run: |
          docker push gcr.io/$GCP_PROJECT_ID/handwritten-digit-recognizer-app:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy handwritten-digit-recognizer-app \
            --image gcr.io/$GCP_PROJECT_ID/handwritten-digit-recognizer-app:$GITHUB_SHA \
            --platform managed \
            --region asia-east1 \
            --allow-unauthenticated
